<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>studylog-Dasboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cream">
    <nav>
        <a href="index.html">Home</a>
        <a href="log.html">Log session</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>

    <h1>Dashboard</h1>

    <section id="stats">
        <div>
            <p>Total minutes</p>
            <p id="total-minutes">0</p>
        </div>
        <div>
            <p>Sessions</p>
            <p id="session-count">0</p>
        </div>
    </section>
     <h2>Recent sessions</h2>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Subject</th>
                <th>Minutes</th>
                <th>Note</th>
            </tr>
        </thead>
        <tbody id="sessions-body"></tbody>
    </table>
    <script src="script.js"></script>
    
</body>
</html>
